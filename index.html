{ n: 9, topic: "Final", title: "Section B", sub: "Choose one of two questions", code: "SECTIONB", img: "cover",
  terms: ["gig economy", "profit-related pay", "performance-related pay", "stimulus"],
  steps: [
  { id: "b9s0", type: "choice", title: "Choose your Section B question",
    q: "As in the real Paper 2, answer one question. Read both first.",
    opts: [
      { k: "Q3", t: "The gig economy installers", d: "Should Orgoo replace 10 permanent installers with app-based crews?", val: 0, set: { sectionB: "A" }, out: "Question 3: two calculations, a 4-mark explanation and a 10-mark discussion.", concept: "Section B ends with a 10-mark extended response that uses your own numbers." },
      { k: "Q4", t: "Profit share or PRP", d: "Which reward scheme should Orgoo fund?", val: 0, set: { sectionB: "B" }, out: "Question 4: two calculations, a 4-mark explanation and a 10-mark recommendation.", concept: "Section B ends with a 10-mark extended response that uses your own numbers." }
    ] },
  // ---- Q3
  { id: "b9a1", type: "story", title: "Question 3: the installers", show: s => s.vars.sectionB === "A",
    text: `<p>Orgoo employs <b>10 permanent installers</b> at <b>MNT 24,000,000 a year</b> each. It installs <b>500 gers a year</b>. App-based crews charge <b>MNT 350,000 per ger</b>.</p><p class="small">All figures fictional.</p>` },
  { id: "b9a2", type: "num", topic: "Final", cmd: "Calculate", marks: 2, show: s => s.vars.sectionB === "A",
    q: "Calculate the yearly cost of using app-based crews for all 500 installations.",
    formula: "Cost = gers × price per ger", answer: 175000000, unit: "MNT",
    explain: "500 × 350,000 = <b>MNT 175,000,000</b>." },
  { id: "b9a3", type: "num", topic: "Final", cmd: "Calculate", marks: 2, show: s => s.vars.sectionB === "A",
    q: "Calculate the yearly saving compared with permanent installers.",
    formula: "Saving = permanent cost - app cost", answer: 65000000, unit: "MNT",
    explain: "10 × 24,000,000 = 240,000,000. 240,000,000 - 175,000,000 = <b>MNT 65,000,000</b> a year." },
  { id: "b9a4", type: "build", topic: "Final", cmd: "Explain", marks: 4, show: s => s.vars.sectionB === "A",
    q: "Explain one advantage and one disadvantage for Orgoo of replacing its permanent installers. [4]",
    slots: [
      { label: "Advantage: the point", opts: ["Lower and more flexible labour costs", "Better training for installers", "More loyal installers"] },
      { label: "Advantage: link to the data", opts: ["A saving of MNT 65 million a year, with no cost in the winter months", "MNT 24 million per installer", "500 gers installed"] },
      { label: "Disadvantage: the point", opts: ["Less control over quality and reliability", "Higher fixed costs", "Fewer customers"] },
      { label: "Disadvantage: link to the data", opts: ["App crews are not trained by Orgoo; a leaking roof seal harms a brand that sells on quality", "The app charges MNT 350,000", "There are 10 installers"] }
    ],
    explain: "Use your own calculations: MNT 175m against MNT 240m." },
  { id: "b9a5", type: "notebook", topic: "Final", cmd: "Discuss", marks: 10, show: s => s.vars.sectionB === "A",
    q: "Using the stimulus and your answers, discuss whether Orgoo should replace its 10 permanent installers with app-based crews. [10]",
    guide: ["Define gig economy.", "Use your numbers: MNT 240m against MNT 175m, a saving of MNT 65m a year.", "Arguments for: cost, flexibility for seasonal demand.", "Arguments against: quality, reliability, loyalty, training, brand.", "Stakeholders: installers, customers, Tsetseg, the app crews.", "Judgment, the condition it depends on, and the key factor."],
    model: ["<b>Term:</b> the gig economy is work done as short separate jobs, often booked through apps, instead of permanent employment.", "<b>Numbers:</b> permanent installers cost MNT 240m a year; app crews MNT 175m; saving MNT 65m a year.", "<b>For:</b> most installations happen May to September, so paying per ger matches cost to demand; the saving could fund training or price cuts.", "<b>Against:</b> Orgoo loses control of quality; late crews and a leaking roof seal already caused complaints; skilled installers who leave may join competitors.", "<b>Stakeholders:</b> 10 installers lose secure jobs (morale across the factory may fall); customers may get less reliable service; app crews gain work.", "<b>Judgment:</b> for example, keep a small permanent core to train and check app crews in summer; the key factor is whether quality can be controlled, because Orgoo competes on quality."],
    bands: MARKBAND },
  // ---- Q4
  { id: "b9b1", type: "story", title: "Question 4: two reward schemes", show: s => s.vars.sectionB === "B",
    text: `<p>Orgoo made a profit of <b>MNT 900 million</b>. The board can fund <b>one</b> scheme:</p>
<div class="data"><div><b>Scheme X, profit-related pay:</b> 5% of profit shared equally by all 120 staff.</div><div><b>Scheme Y, performance-related pay:</b> a bonus of MNT 1,200,000 for each production worker who meets the targets set at appraisal. Last year, 30 of the 100 production workers would have met them.</div></div><p class="small">All figures fictional.</p>` },
  { id: "b9b2", type: "num", topic: "Final", cmd: "Calculate", marks: 2, show: s => s.vars.sectionB === "B",
    q: "Calculate the payment each employee would receive under Scheme X.",
    formula: "Payment = 5% × profit ÷ number of staff", answer: 375000, unit: "MNT",
    explain: "5% × 900,000,000 = 45,000,000. 45,000,000 ÷ 120 = <b>MNT 375,000</b> each." },
  { id: "b9b3", type: "num", topic: "Final", cmd: "Calculate", marks: 2, show: s => s.vars.sectionB === "B",
    q: "Calculate the total cost of Scheme Y, based on last year.",
    formula: "Cost = workers meeting targets × bonus", answer: 36000000, unit: "MNT",
    explain: "30 × 1,200,000 = <b>MNT 36,000,000</b>, MNT 9 million less than Scheme X." },
  { id: "b9b4", type: "build", topic: "Final", cmd: "Explain", marks: 4, show: s => s.vars.sectionB === "B",
    q: "Explain one advantage and one disadvantage of Scheme Y for Orgoo. [4]",
    slots: [
      { label: "Advantage: the point", opts: ["It rewards individual performance, linking effort to reward", "Everyone receives the same", "It costs more than Scheme X"] },
      { label: "Advantage: link to the data", opts: ["A worker who meets targets gets MNT 1,200,000, over three times the Scheme X payment", "Profit is MNT 900 million", "There are 120 staff"] },
      { label: "Disadvantage: the point", opts: ["Most workers get nothing, which may feel unfair", "It improves teamwork automatically", "It removes appraisal"] },
      { label: "Disadvantage: link to the data", opts: ["70 of 100 production workers would receive no bonus, which may raise turnover", "30 workers meet targets", "The bonus is MNT 1.2 million"] }
    ],
    explain: "Expectancy and equity theory (HL) explain both sides: a clear link to reward, but perceived unfairness." },
  { id: "b9b5", type: "notebook", topic: "Final", cmd: "Recommend", marks: 10, show: s => s.vars.sectionB === "B",
    q: "Using the stimulus and your answers, recommend which reward scheme Orgoo should fund. [10]",
    guide: ["Define profit-related pay and performance-related pay.", "Use your numbers: MNT 375,000 each (X, MNT 45m) against MNT 1.2m for 30 workers (Y, MNT 36m).", "Scheme X: advantages and disadvantages.", "Scheme Y: advantages and disadvantages.", "A motivation theory: Herzberg, Taylor, or (HL) equity or expectancy.", "Recommendation, the condition it depends on, and the key factor."],
    model: ["<b>Terms:</b> profit-related pay shares company profit with staff; PRP pays a bonus for meeting individual targets.", "<b>Numbers:</b> X costs MNT 45m (MNT 375,000 each); Y costs MNT 36m (MNT 1.2m for 30 workers, nothing for 70).", "<b>X:</b> builds teamwork and is seen as fair; but MNT 375,000 is small and the link between one worker's effort and profit is weak.", "<b>Y:</b> strong link between effort and reward (expectancy); cheaper; but 70% get nothing and targets must be fair, or equity problems raise turnover.", "<b>Theory:</b> Taylor supports Y (money for output); Herzberg warns pay alone is a hygiene factor.", "<b>Recommendation:</b> for example, Scheme Y if appraisal targets are trusted, or X if teamwork and retention are the priority; the key factor is whether workers see the targets as fair."],
    bands: MARKBAND }
  ] }
];

<script>
const KEY = GAME.key;
const MASTER = "MRCHRIS";
let S = load() || fresh();
let ui = {};
function fresh(){ return { name:"", val:10, ch:0, step:0, screen:"start", unlocked:{}, vars:{}, res:{}, master:false }; }
function load(){ try{ const t = localStorage.getItem(KEY); return t ? JSON.parse(t) : null; }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
const $ = id => document.getElementById(id);
const fmt = n => { const r = Math.round(n*10)/10; return r.toLocaleString("en-US"); };
const money = n => "MNT " + Math.round(n).toLocaleString("en-US");
function val(x){ return typeof x === "function" ? x(S) : x; }
function esc(t){ return String(t).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
function gl(html){
  return String(html).replace(/\[\[([^\]]+)\]\]/g, (m, w) => {
    const k = Object.keys(GLOSSARY).find(g => g.toLowerCase() === w.toLowerCase());
    return k ? `<span class="term" data-act="term" data-term="${k}">${w}</span>` : w;
  });
}
function rng(seed){ let h = 2166136261; for (const c of seed) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return () => { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; return ((h >>> 0) % 100000) / 100000; }; }
function shuffled(arr, seed){ const r = rng(seed); const idx = arr.map((_, i) => i); for (let i = idx.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; } return idx; }
function parseNum(t){ if (t == null) return NaN; t = String(t).trim().toLowerCase().replace(/mnt|,|%|\s/g, ""); let mult = 1; if (/(billion|bn)$/.test(t)) { mult = 1e9; t = t.replace(/(billion|bn)$/, ""); } else if (/(million|m)$/.test(t)) { mult = 1e6; t = t.replace(/(million|m)$/, ""); } return parseFloat(t) * mult; }
function close(x, ans){ if (isNaN(x)) return false; const tol = Math.max(Math.abs(ans) * 0.005, 0.01); return [1, 1e6, 1e9].some(k => Math.abs(x * k - ans) <= tol); }

function ch(){ return CHAPTERS[S.ch]; }
function step(){ return ch().steps[S.step]; }
function addVal(d){ S.val = Math.round((S.val + d) * 10) / 10; }
function record(st, earned, extra){ S.res[st.id] = Object.assign({ done:true, earned, max: st.marks || 0, topic: st.topic, ch: S.ch }, extra || {}); addVal(earned); save(); render(); }

function header(){
  $("brand").innerHTML = GAME.brand;
  $("val").textContent = "MNT " + fmt(S.val) + "M";
  $("dots").innerHTML = CHAPTERS.map((c, i) => `<i class="${i < S.ch || (S.screen === "report") ? "done" : i === S.ch && S.screen !== "start" ? "cur" : ""}"></i>`).join("");
}
function chips(st){
  let h = `<div class="chips"><span class="chip topic">${st.topic === "Final" ? (GAME.finalLabel || "Paper 1") : st.topic}</span>`;
  if (st.cmd) h += `<span class="chip cmd">${st.cmd} · ${CMD[st.cmd] || ""} · [${st.marks}]</span>`;
  if (st.hl) h += `<span class="chip hl">HL only · SL bonus</span>`;
  return h + "</div>";
}
function heroFor(c){
  const im = IMG[c.img];
  return `<div class="hero">${im ? `<img src="${im}" alt="">` : ""}<div class="cap"><div class="chn">${c.n === CHAPTERS.length ? "Finale" : (GAME.chapterWord || "Chapter") + " " + c.n} · ${c.topic === "Final" ? (GAME.finalLabel || "Paper 1") : c.topic}</div><h1>${c.title}</h1><div class="sub">${c.sub}</div></div></div>${CREDITS[c.img] ? `<div class="credit">Photo: ${CREDITS[c.img]}</div>` : ""}`;
}
function nextBtn(label){ return `<div class="row"><button class="btn" data-act="next">${label || "Continue →"}</button></div>`; }

let lastKey = "";
function render(){
  header();
  const app = $("app");
  const key = S.screen + "|" + S.ch + "|" + S.step;
  if (key !== lastKey) { lastKey = key; app.classList.add("anim"); window.scrollTo(0, 0); } else app.classList.remove("anim");
  if (S.screen === "start") return app.innerHTML = startScreen();
  if (S.screen === "gate") return app.innerHTML = gateScreen();
  if (S.screen === "end") return app.innerHTML = endScreen();
  if (S.screen === "report") return app.innerHTML = reportScreen();
  const c = ch(), st = step();
  app.innerHTML = heroFor(c) + renderStep(st);
}

function startScreen(){
  return `<div class="hero">${IMG.cover ? `<img src="${IMG.cover}" alt="">` : ""}<div class="cap"><div class="chn">${GAME.kicker}</div><h1>${GAME.title}</h1><div class="sub">${GAME.sub}</div></div></div>${CREDITS.cover ? `<div class="credit">Photo: ${CREDITS.cover}</div>` : ""}
<div class="card"><h2>How to play</h2>${GAME.howto}
<p>📖 Tap any <span class="term" data-act="term" data-term="${GAME.demoTerm}">underlined word</span> to see what it means.</p></div>
<div class="card"><h2>Your name</h2><p class="small">First name only. It stays on this device.</p>
<input class="num" id="nm" maxlength="24" placeholder="e.g. Temuulen" value="${esc(S.name)}">
<div class="row"><button class="btn" data-act="startgo">Start →</button></div></div>
<footer class="cr">All businesses, people and figures in this game are fictional and for practice only. Photos: see the menu (☰).</footer>`;
}
function gateScreen(){
  const c = ch();
  return heroFor(c) + `<div class="card"><h2>🔑 Enter the chapter code</h2><p>Watch the board. Mr. Chris will show the code when the class is ready.</p>
<div class="codein"><input id="code" autocomplete="off" autocapitalize="characters" placeholder="CODE"><button class="btn" data-act="code">Open</button></div>
${ui.codeErr ? `<div class="fb bad">Not yet. Check the board and try again.</div>` : ""}</div>`;
}
function renderStep(st){
  const r = S.res[st.id];
  switch (st.type) {
    case "story": return `<div class="card"><div class="chips"><span class="chip story">${st.chip || "Story"}</span></div><h2>${st.title}</h2>${gl(val(st.text))}${nextBtn()}</div>`;
    case "choice": return choiceStep(st, r);
    case "mcq": return mcqStep(st, r);
    case "sort": return sortStep(st, r);
    case "num": return numStep(st, r);
    case "build": return buildStep(st, r);
    case "order": return orderStep(st, r);
    case "statement": return stmtStep(st, r);
    case "notebook": return nbStep(st, r);
  }
}
function choiceStep(st, r){
  let h = `<div class="card"><div class="chips"><span class="chip story">Your decision</span></div><h2>${st.title}</h2><p class="q">${gl(val(st.q))}</p>`;
  st.opts.forEach((o, i) => {
    const cls = r ? (r.pick === i ? "opt sel" : "opt") : "opt";
    h += `<button class="${cls}" data-act="choose" data-i="${i}" ${r ? "disabled" : ""}><span class="k">${o.k}</span><b>${o.t}</b><span class="d">${gl(o.d)}</span></button>`;
  });
  if (r) {
    const o = st.opts[r.pick];
    const out = o.outFn ? o.outFn(S) : o.out;
    const d = r.delta;
    h += `<div class="fb neutral"><b class="t">What happens</b>${gl(out)}<p style="margin:8px 0 0"><b>Business idea:</b> ${gl(o.concept)}</p><p class="earn" style="margin:6px 0 0">Valuation ${d >= 0 ? "+" : ""}${fmt(d)} million</p>${r.after ? `<p style="margin:8px 0 0">${r.after}</p>` : ""}</div>${nextBtn()}`;
  }
  return h + "</div>";
}
function mcqStep(st, r){
  const opts = val(st.opts), order = shuffled(opts, st.id);
  const tries = (r && r.tries) || ui.tries || [];
  let h = `<div class="card">${chips(st)}${figOf(st)}<p class="q">${gl(val(st.q))}</p>`;
  order.forEach(i => {
    let cls = "opt";
    if (tries.includes(i)) cls += i === st.a ? " right" : " wrong";
    if (r && i === st.a) cls = "opt right";
    h += `<button class="${cls}" data-act="mcq" data-i="${i}" ${r || tries.includes(i) ? "disabled" : ""}>${gl(opts[i])}</button>`;
  });
  if (!r && tries.length === 1) h += `<div class="fb bad"><b class="t">Not quite. One more try.</b></div>`;
  if (r) h += `<div class="fb ${r.earned > 0 ? "" : "bad"}"><b class="t">${r.earned === st.marks ? "Correct." : r.earned > 0 ? "Correct on the second try." : "The answer is shown in green."} <span class="earn">+${fmt(r.earned)}</span></b>${gl(val(st.explain))}</div>${nextBtn()}`;
  return h + "</div>";
}
function figOf(st){ let f = ""; if (st.table) f += tableHtml(val(st.table)); if (st.fig) f += val(st.fig); return f; }
function sortStep(st, r){
  const pick = r ? r.pick : (ui.pick || {});
  const order = shuffled(st.items, st.id);
  let h = `<div class="card">${chips(st)}<p class="q">${gl(st.q)}</p>`;
  order.forEach(i => {
    const [t, a] = st.items[i];
    h += `<div class="sortitem"><div class="it">${gl(t)}${r ? `<span class="mark" style="color:${pick[i] === a ? "var(--teal)" : "var(--red)"}">${pick[i] === a ? "✓" : "✗"}</span>` : ""}</div><div class="cats">`;
    st.cats.forEach((c, ci) => {
      let cls = "cat";
      if (r) { if (ci === a) cls += " right"; else if (pick[i] === ci) cls += " wrong"; }
      else if (pick[i] === ci) cls += " sel";
      h += `<button class="${cls}" data-act="sortpick" data-i="${i}" data-c="${ci}" ${r ? "disabled" : ""}>${c}</button>`;
    });
    h += `</div></div>`;
  });
  const all = st.items.every((_, i) => pick[i] !== undefined);
  if (!r) h += `<div class="row"><button class="btn" data-act="sortcheck" ${all ? "" : "disabled"}>Check</button><span class="small">${Object.keys(pick).length}/${st.items.length} placed</span></div>`;
  else h += `<div class="fb ${r.earned > 0 ? "" : "bad"}"><b class="t">${r.right}/${st.items.length} correct <span class="earn">+${fmt(r.earned)}</span></b>${gl(val(st.explain))}</div>${nextBtn()}`;
  return h + "</div>";
}
function tableHtml(t){ return `<table class="data"><tr>${t.head.map(x => `<th>${x}</th>`).join("")}</tr>${t.rows.map(rw => `<tr>${rw.map(x => `<td>${x}</td>`).join("")}</tr>`).join("")}</table>`; }
function numStep(st, r){
  const tries = (r && r.tries) || ui.tries || [];
  let h = `<div class="card">${chips(st)}${figOf(st)}<p class="q">${gl(val(st.q))}</p><div class="formula">🧮 ${st.formula}</div>`;
  if (!r) {
    h += `<input class="num" id="ans" inputmode="decimal" placeholder="${st.unit === "%" ? "Answer in %, e.g. 52.5" : "Answer in " + st.unit + ", e.g. 1,250,000"}" autocomplete="off"><div class="row"><button class="btn" data-act="numcheck">Check</button><span class="small">Work it out in your notebook first.</span></div>`;
    if (tries.length === 1) h += `<div class="fb bad"><b class="t">Not quite (you entered ${esc(tries[0])}). Check your working and try once more.</b></div>`;
  } else {
    h += `<div class="fb ${r.earned > 0 ? "" : "bad"}"><b class="t">${r.earned === st.marks ? "Correct." : r.earned > 0 ? "Correct on the second try." : "Here is the working."} <span class="earn">+${fmt(r.earned)}</span></b>${gl(val(st.explain))}</div>${nextBtn()}`;
  }
  return h + "</div>";
}
function buildStep(st, r){
  const pick = r ? r.pick : (ui.pick || {});
  const slots = val(st.slots);
  let h = `<div class="card">${chips(st)}${figOf(st)}<p class="q">${gl(val(st.q))}</p><p class="small">Build the answer an examiner would reward. Choose one piece for each part.</p>`;
  slots.forEach((sl, si) => {
    h += `<div class="slot"><div class="lab">${sl.label}</div>`;
    shuffled(sl.opts, st.id + si).forEach(oi => {
      let cls = "opt";
      if (r) { if (oi === 0) cls += " right"; else if (pick[si] === oi) cls += " wrong"; }
      else if (pick[si] === oi) cls += " sel";
      h += `<button class="${cls}" data-act="buildpick" data-s="${si}" data-o="${oi}" ${r ? "disabled" : ""}>${sl.opts[oi]}</button>`;
    });
    h += `</div>`;
  });
  const all = slots.every((_, i) => pick[i] !== undefined);
  if (!r) h += `<div class="row"><button class="btn" data-act="buildcheck" ${all ? "" : "disabled"}>Check my answer</button></div>`;
  else {
    const full = slots.map(sl => sl.opts[0]);
    h += `<div class="fb ${r.earned > 0 ? "" : "bad"}"><b class="t">${fmt(r.earned)} of ${st.marks} marks <span class="earn">+${fmt(r.earned)}</span></b>${gl(st.explain)}<p style="margin:8px 0 0"><b>Full-mark answer:</b> ${full.join(". ")}.</p><p class="small" style="margin:6px 0 0">📓 Copy the full-mark answer into your notebook.</p></div>${nextBtn()}`;
  }
  return h + "</div>";
}
function orderStep(st, r){
  const seq = r ? r.seq : (ui.seq || []);
  const pool = shuffled(st.items, st.id).filter(i => !seq.includes(i));
  let h = `<div class="card order">${chips(st)}<p class="q">${gl(st.q)}</p><div class="picked">`;
  seq.forEach((i, pos) => h += `<span class="pk ${r ? (i === pos ? "right" : "wrong") : ""}">${pos + 1}. ${st.items[i]}${r && i !== pos ? ` <span class="small">→ should be: ${st.items[pos]}</span>` : ""}</span>`);
  if (!seq.length) h += `<span class="small">Tap the lines below in order.</span>`;
  h += `</div>`;
  if (!r) {
    h += `<div class="pool">${pool.map(i => `<button class="cat" data-act="orderpick" data-i="${i}">${st.items[i]}</button>`).join("")}</div>
<div class="row"><button class="btn" data-act="ordercheck" ${seq.length === st.items.length ? "" : "disabled"}>Check</button><button class="btn ghost" data-act="orderundo" ${seq.length ? "" : "disabled"}>Undo</button></div>`;
  } else h += `<div class="fb ${r.earned > 0 ? "" : "bad"}"><b class="t">${r.right}/${st.items.length} in the right place <span class="earn">+${fmt(r.earned)}</span></b>${st.explain}</div>${nextBtn()}`;
  return h + "</div>";
}
function cellNum(n){ if (n == null) return ""; const a = Math.abs(n); const s = (Math.round(a * 100) / 100).toLocaleString("en-US"); return n < 0 ? `(${s})` : s; }
function stmtStep(st, r){
  const rows = val(st.rows);
  const ans = r ? r.ans : {};
  let h = `<div class="card">${chips(st)}<p class="q">${gl(st.q)}</p><table class="stmt"><tr><th>${val(st.title)}</th><th>MNT m</th></tr>`;
  rows.forEach((rw, i) => {
    const [label, given, answer] = rw;
    const tot = label.startsWith("=");
    if (answer === undefined) h += `<tr class="${tot ? "tot" : ""}"><td>${label}</td><td>${cellNum(given)}</td></tr>`;
    else {
      const ok = r ? r.ok[i] : null;
      h += `<tr class="${tot ? "tot" : ""} ${r ? (ok ? "ok" : "no") : ""}"><td>${label}</td><td><input class="num small" data-row="${i}" inputmode="decimal" ${r ? `value="${esc(ans[i] || "")}" disabled` : ""}>${r && !ok ? `<span class="corr">${cellNum(answer)}</span>` : ""}</td></tr>`;
    }
  });
  h += `</table>`;
  if (!r) h += `<div class="row"><button class="btn" data-act="stmtcheck">Check statement</button>${rows.some(r => typeof r[1] === "number" && r[1] < 0) ? `<span class="small">Brackets = taken away.</span>` : ""}</div>`;
  else h += `<div class="fb ${r.earned > 0 ? "" : "bad"}"><b class="t">${r.right}/${r.n} lines correct <span class="earn">+${fmt(r.earned)}</span></b>${val(st.explain)}<p class="small" style="margin:6px 0 0">📓 Copy the full statement into your notebook in this format.</p></div>${nextBtn()}`;
  return h + "</div>";
}
function nbStep(st, r){
  let h = `<div class="card">${chips(st)}<p class="q">${gl(st.q)}</p><p>📓 <b>Write a plan in your notebook</b> (6 to 8 minutes). Use these headings:</p><ol class="model">${st.guide.map(g => `<li>${g}</li>`).join("")}</ol>`;
  if (!r && !ui.reveal) return h + `<div class="row"><button class="btn" data-act="nbreveal">I have written my plan →</button></div></div>`;
  h += `<div class="fb neutral"><b class="t">A model plan</b><ol class="model">${val(st.model).map(m => `<li>${gl(m)}</li>`).join("")}</ol></div>`;
  h += `<p style="margin-top:14px"><b>Mark your plan.</b> Compare it with the markband, then ask your team's Examiner to agree your mark.</p><div class="bands">${st.bands.map(b => `<button disabled><b>${b[0]}</b>${b[1]}</button>`).join("")}</div>`;
  const pick = r ? r.earned : ui.nb;
  h += `<p class="small">My mark out of 10:</p><div class="nums">${[...Array(11).keys()].map(n => `<button class="${pick === n ? "sel" : ""}" data-act="nbpick" data-n="${n}" ${r ? "disabled" : ""}>${n}</button>`).join("")}</div>`;
  if (!r) h += `<div class="row"><button class="btn" data-act="nbsave" ${ui.nb === undefined ? "disabled" : ""}>Confirm my mark</button></div>`;
  else h += `<div class="fb"><b class="t">Mark recorded <span class="earn">+${fmt(r.earned)}</span></b>Be honest: an exam marker will not be generous.</div>${nextBtn("See the chapter summary →")}`;
  return h + "</div>";
}
function chapterScore(i){ let e = 0, m = 0; Object.values(S.res).forEach(x => { if (x.ch === i && x.max) { e += x.earned; m += x.max; } }); return [e, m]; }
function endScreen(){
  const c = ch(); const [e, m] = chapterScore(S.ch);
  const last = S.ch === CHAPTERS.length - 1;
  return heroFor(c) + `<div class="card"><div class="chips"><span class="chip story">Chapter complete</span></div><h2>Board report: ${c.title}</h2>
<p>Exam questions: <b>${fmt(e)} of ${m}</b> marks.</p><p>Company valuation: <span class="earn">MNT ${fmt(S.val)} million</span></p>
<p>👥 <b>Team talk:</b> who in your team made a different decision? What happened to them?</p></div>
<div class="card"><h2>While you wait: key terms</h2><p class="small">Say the meaning, then tap to check.</p><div class="flip">${c.terms.map((t, i) => `<button data-act="flip" data-i="${i}">${ui.flip && ui.flip[i] ? `<b>${t}</b><br>${GLOSSARY[t]}` : `<b>${t}</b><br><span class="small">Tap to check</span>`}</button>`).join("")}</div></div>
<div class="row"><button class="btn" data-act="tonext">${last ? "See my Founder's Report →" : "Next chapter →"}</button></div>`;
}
function topicMap(){
  const t = {}; Object.values(S.res).forEach(x => { if (!x.max) return; t[x.topic] = t[x.topic] || [0, 0]; t[x.topic][0] += x.earned; t[x.topic][1] += x.max; });
  return t;
}
const PATHS = GAME.paths;
function reportScreen(){
  const t = topicMap(); const keys = GAME.topics;
  const names = GAME.names; const _unused = { "1.1": "What is a business?", "1.2": "Types of entities", "1.3": "Objectives", "1.4": "Stakeholders", "1.5": "Growth", "1.6": "MNCs", "3.1": "Intro to finance", "3.2": "Sources of finance", "3.3": "Costs and revenues", "3.4": "Final accounts", "Final": "10-mark plan" };
  let rows = "", weak = [];
  keys.forEach(k => { if (!t[k]) return; const p = t[k][0] / t[k][1]; const c = p >= .75 ? "g" : p >= .5 ? "a" : "r"; if (c !== "g" && k !== "Final") weak.push(k + " " + names[k]); rows += `<tr><td>${k} ${names[k]}</td><td><div class="bar"><i class="${c}" style="width:${Math.round(p * 100)}%"></i></div></td><td style="text-align:right">${Math.round(p * 100)}%</td></tr>`; });
  const tot = Object.values(t).reduce((a, b) => [a[0] + b[0], a[1] + b[1]], [0, 0]);
  const v = S.val, title = v >= (GAME.tiers || [120])[0] ? "Market leader" : v >= (GAME.tiers || [0, 90])[1] ? "Fast-growing company" : v >= (GAME.tiers || [0, 0, 60])[2] ? "Established business" : "Steady recovery";
  const path = Object.keys(PATHS).filter(k => S.vars[k]).map(k => `<li>${PATHS[k][S.vars[k]]}</li>`).join("");
  return `<div class="card cert"><div class="chips" style="justify-content:center"><span class="chip story">Founder's Report</span></div><div class="name">${esc(S.name || "Founder")}</div><p class="small">${GAME.reportSub}</p><div class="big">MNT ${fmt(v)} million</div><p><b>${title}</b> · exam marks ${fmt(tot[0])} of ${tot[1]} (${Math.round(tot[0] / tot[1] * 100)}%)</p><p class="small">📱 Show this screen to Mr. Chris.</p></div>
<div class="card"><h2>Your revision map</h2><table class="map">${rows}</table><p style="margin-top:10px">${weak.length ? `🎯 <b>Revise first:</b> ${weak.join(", ")}. Reread these sections in your coursebook tonight.` : "🎯 Strong across every topic. Next step: past Paper 1 and Paper 2 questions."}</p></div>
<div class="card"><h2>Your path</h2><ul class="path">${path}</ul><p class="small">Different choices lead to different accounts and endings. Play again to try another path.</p><div class="row"><button class="btn ghost" data-act="reset">Play again</button></div></div>`;
}
function showMenu(){
  const cr = Object.values(CREDITS).filter((x, i, a) => a.indexOf(x) === i).map(x => `<li>${x}</li>`).join("");
  $("pop").innerHTML = `<div class="pop"><b>Menu</b><p class="small">Progress is saved on this device.</p><div class="row"><button class="btn ghost" data-act="reset">Start again</button><button class="btn" data-act="popclose">Close</button></div><p class="small" style="margin-top:10px"><b>Photo credits</b></p><ul class="small">${cr}</ul><p class="small">All businesses, people and figures in the story are fictional.</p></div>`;
}

document.addEventListener("click", ev => {
  const b = ev.target.closest("[data-act]"); if (!b) { if (!ev.target.closest(".pop")) $("pop").innerHTML = ""; return; }
  const a = b.dataset.act, st = (S.screen === "play") ? step() : null;
  if (a === "term") { const k = b.dataset.term; $("pop").innerHTML = `<div class="pop"><b>${k}</b><br>${GLOSSARY[k]}</div>`; ev.stopPropagation(); return; }
  if (a === "menu") return showMenu();
  if (a === "popclose") { $("pop").innerHTML = ""; return; }
  if (a === "reset") {
    if (!ui.confirmReset) { ui.confirmReset = true; b.textContent = "Tap again to erase my progress"; return; }
    S = fresh(); ui = {}; save(); $("pop").innerHTML = ""; return render();
  }
  if (a === "startgo") { S.name = ($("nm").value || "").trim().slice(0, 24); S.screen = "gate"; S.ch = 0; save(); return render(); }
  if (a === "code") {
    const v = ($("code").value || "").trim().toUpperCase();
    if (v === MASTER) S.master = true;
    if (v === ch().code || v === MASTER) { S.unlocked[S.ch] = true; S.screen = "play"; S.step = 0; ui = {}; save(); return render(); }
    ui.codeErr = true; return render();
  }
  if (a === "next") { ui = {}; let n = S.step + 1; while (n < ch().steps.length && ch().steps[n].show && !ch().steps[n].show(S)) n++; if (n < ch().steps.length) S.step = n; else S.screen = "end"; save(); return render(); }
  if (a === "tonext") {
    ui = {};
    if (S.ch === CHAPTERS.length - 1) { S.screen = "report"; save(); return render(); }
    S.ch++; S.step = 0; S.screen = (S.master || S.unlocked[S.ch]) ? "play" : "gate"; save(); return render();
  }
  if (a === "flip") { ui.flip = ui.flip || {}; ui.flip[b.dataset.i] = !ui.flip[b.dataset.i]; return render(); }
  if (!st) return;
  if (a === "choose" && !S.res[st.id]) {
    const i = +b.dataset.i, o = st.opts[i];
    if (o.set && o.set.entity) S.vars.entityBefore = S.vars.entity;
    Object.assign(S.vars, o.set || {});
    const d = o.valFn ? o.valFn(S) : o.val;
    const after = st.after ? st.after(S) : "";
    S.res[st.id] = { done: true, pick: i, delta: d, after, ch: S.ch, max: 0, earned: 0 };
    addVal(d); save(); return render();
  }
  if (a === "mcq") {
    const i = +b.dataset.i; ui.tries = ui.tries || [];
    if (ui.tries.includes(i)) return;
    ui.tries.push(i);
    if (i === st.a) return record(st, ui.tries.length === 1 ? st.marks : st.marks / 2, { tries: ui.tries });
    if (ui.tries.length >= 2) return record(st, 0, { tries: ui.tries });
    return render();
  }
  if (a === "sortpick") { ui.pick = ui.pick || {}; ui.pick[b.dataset.i] = +b.dataset.c; return render(); }
  if (a === "sortcheck") {
    const right = st.items.filter((it, i) => ui.pick[i] === it[1]).length;
    return record(st, Math.round(st.marks * right / st.items.length * 2) / 2, { pick: ui.pick, right });
  }
  if (a === "numcheck") {
    const raw = $("ans").value; const x = parseNum(raw); ui.tries = ui.tries || [];
    if (raw.trim() === "") return;
    ui.tries.push(raw);
    if (close(x, val(st.answer)) || (st.alt !== undefined && close(x, val(st.alt)))) return record(st, ui.tries.length === 1 ? st.marks : st.marks / 2, { tries: ui.tries });
    if (ui.tries.length >= 2) return record(st, 0, { tries: ui.tries });
    return render();
  }
  if (a === "buildpick") { ui.pick = ui.pick || {}; ui.pick[b.dataset.s] = +b.dataset.o; return render(); }
  if (a === "buildcheck") { const sl = val(st.slots); const right = sl.filter((_, i) => ui.pick[i] === 0).length; return record(st, right * st.marks / sl.length, { pick: ui.pick, right }); }
  if (a === "orderpick") { ui.seq = ui.seq || []; ui.seq.push(+b.dataset.i); return render(); }
  if (a === "orderundo") { ui.seq.pop(); return render(); }
  if (a === "ordercheck") { const right = ui.seq.filter((x, p) => x === p).length; return record(st, Math.round(st.marks * right / st.items.length * 2) / 2, { seq: ui.seq, right }); }
  if (a === "stmtcheck") {
    const rows = val(st.rows); const ans = {}, ok = {}; let n = 0, right = 0;
    document.querySelectorAll("input[data-row]").forEach(inp => {
      const i = +inp.dataset.row; ans[i] = inp.value; n++;
      const x = parseNum(inp.value), want = Math.abs(rows[i][2]);
      ok[i] = !isNaN(x) && Math.abs(Math.abs(x) - want) <= 0.051; if (ok[i]) right++;
    });
    return record(st, Math.round(st.marks * right / n * 2) / 2, { ans, ok, right, n });
  }
  if (a === "nbreveal") { ui.reveal = true; return render(); }
  if (a === "nbpick") { ui.nb = +b.dataset.n; return render(); }
  if (a === "nbsave") return record(st, ui.nb, {});
});
document.addEventListener("keydown", e => { if (e.key === "Enter") { const c = document.querySelector('[data-act="code"],[data-act="numcheck"]'); if (c && document.activeElement && document.activeElement.tagName === "INPUT") c.click(); } });
render();
</script>
